name: Quant-RL tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "phase2/**"]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Quant-RL-5.0.0rc29/pyproject.toml
      - name: Install package and test dependencies
        working-directory: Quant-RL-5.0.0rc29
        run: python -m pip install -e ".[dev]"
      - name: Run full test suite
        working-directory: Quant-RL-5.0.0rc29
        run: python -m pytest -q
